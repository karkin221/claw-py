<svg xmlns="http://www.w3.org/2000/svg" width="680" height="392" viewBox="0 0 680 392" role="img">
<title>Generation time per iteration</title><desc>Model generation seconds per iteration: 277, 516, 56, 279 and 55, of 1183 wall-clock seconds. Iteration two produced a failed edit.</desc>
<style>
  svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .grid { stroke: #D3D1C7; stroke-width: 0.5; }
  .axis { stroke: #B4B2A9; stroke-width: 1; }
  .ref { stroke: #eb6834; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
  .sys { fill: #888780; } .tools { fill: #1baf7a; } .hist { fill: #2a78d6; }
  .ok { fill: #2a78d6; } .bad { fill: #eb6834; }
  @media (prefers-color-scheme: dark) {
    .ts { fill: #B4B2A9; } .grid { stroke: #383835; } .axis { stroke: #5F5E5A; }
    .hist, .ok { fill: #3987e5; } .bad { fill: #d95926; } .tools { fill: #199e70; }
  }
</style>
<line class="grid" x1="70" y1="290.0" x2="640" y2="290.0"/>
<text class="ts" x="60" y="290.0" text-anchor="end" dominant-baseline="central">0s</text>
<line class="grid" x1="70" y1="244.0" x2="640" y2="244.0"/>
<text class="ts" x="60" y="244.0" text-anchor="end" dominant-baseline="central">120s</text>
<line class="grid" x1="70" y1="198.0" x2="640" y2="198.0"/>
<text class="ts" x="60" y="198.0" text-anchor="end" dominant-baseline="central">240s</text>
<line class="grid" x1="70" y1="152.0" x2="640" y2="152.0"/>
<text class="ts" x="60" y="152.0" text-anchor="end" dominant-baseline="central">360s</text>
<line class="grid" x1="70" y1="106.0" x2="640" y2="106.0"/>
<text class="ts" x="60" y="106.0" text-anchor="end" dominant-baseline="central">480s</text>
<line class="grid" x1="70" y1="60.0" x2="640" y2="60.0"/>
<text class="ts" x="60" y="60.0" text-anchor="end" dominant-baseline="central">600s</text>
<text class="ts" x="70" y="40">seconds generating</text>
<rect class="ok" x="101.0" y="183.8" width="52" height="106.2" rx="4"/>
<text class="ts" x="127.0" y="173.8" text-anchor="middle">277s</text>
<text class="ts" x="127.0" y="306" text-anchor="middle">1</text>
<rect class="bad" x="215.0" y="92.2" width="52" height="197.8" rx="4"/>
<text class="ts" x="241.0" y="82.2" text-anchor="middle">516s</text>
<text class="ts" x="241.0" y="306" text-anchor="middle">2</text>
<rect class="ok" x="329.0" y="268.5" width="52" height="21.5" rx="4"/>
<text class="ts" x="355.0" y="258.5" text-anchor="middle">56s</text>
<text class="ts" x="355.0" y="306" text-anchor="middle">3</text>
<rect class="ok" x="443.0" y="183.1" width="52" height="107.0" rx="4"/>
<text class="ts" x="469.0" y="173.1" text-anchor="middle">279s</text>
<text class="ts" x="469.0" y="306" text-anchor="middle">4</text>
<rect class="ok" x="557.0" y="268.9" width="52" height="21.1" rx="4"/>
<text class="ts" x="583.0" y="258.9" text-anchor="middle">55s</text>
<text class="ts" x="583.0" y="306" text-anchor="middle">5</text>
<line class="axis" x1="70" y1="290" x2="640" y2="290"/>
<text class="ts" x="355.0" y="328" text-anchor="middle">iteration</text>
<rect class="ok" x="70" y="358" width="12" height="12" rx="3"/>
<text class="ts" x="88" y="364" dominant-baseline="central">model generating</text>
<rect class="bad" x="208" y="358" width="12" height="12" rx="3"/>
<text class="ts" x="226" y="364" dominant-baseline="central">produced a failed edit</text>
</svg>