<text class="ts" x="355.0" y="306" text-anchor="middle">3</text>
<rect class="sys" x="443.0" y="287.4" width="52" height="2.6" rx="3"/>
<rect class="tools" x="443.0" y="270.9" width="52" height="16.5" rx="3"/>
<rect class="hist" x="443.0" y="115.3" width="52" height="155.6" rx="3"/>
