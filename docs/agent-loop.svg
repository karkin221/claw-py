<svg xmlns="http://www.w3.org/2000/svg" width="680" height="970" viewBox="0 0 680 970" role="img">
<title>claw-py agentic turn loop</title>
<desc>Flowchart of ConversationRuntime.run_turn: assemble request, stream from provider, auto-compact check, then either finish with a turn summary or run each pending tool call through PreToolUse hook, permission check, execution, and PostToolUse hook before looping back.</desc>
<style>
  svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .t  { font-size: 14px; font-weight: 400; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  .dash { stroke: #888780; stroke-width: 0.5; fill: none; stroke-dasharray: 4 4; }
  .lbl { fill: #5F5E5A; }
  .c-purple rect, rect.c-purple { fill: #EEEDFE; stroke: #534AB7; }
  .c-purple .th { fill: #3C3489; } .c-purple .ts { fill: #534AB7; }
  .c-coral  rect, rect.c-coral  { fill: #FAECE7; stroke: #993C1D; }
  .c-coral  .th { fill: #712B13; } .c-coral  .ts { fill: #993C1D; }
  .c-gray   rect, rect.c-gray   { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-gray   .th { fill: #444441; } .c-gray   .ts { fill: #5F5E5A; }
  @media (prefers-color-scheme: dark) {
    .arr { stroke: #B4B2A9; } .dash { stroke: #888780; } .lbl { fill: #B4B2A9; }
    .c-purple rect, rect.c-purple { fill: #3C3489; stroke: #AFA9EC; }
    .c-purple .th { fill: #CECBF6; } .c-purple .ts { fill: #AFA9EC; }
    .c-coral  rect, rect.c-coral  { fill: #712B13; stroke: #F0997B; }
    .c-coral  .th { fill: #F5C4B3; } .c-coral  .ts { fill: #F0997B; }
    .c-gray   rect, rect.c-gray   { fill: #444441; stroke: #B4B2A9; }
    .c-gray   .th { fill: #D3D1C7; } .c-gray   .ts { fill: #B4B2A9; }
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<g class="c-gray">
  <rect x="140" y="40" width="360" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="320" y="60" text-anchor="middle" dominant-baseline="central">Turn start</text>
  <text class="ts" x="320" y="80" text-anchor="middle" dominant-baseline="central">repl, one-shot prompt, or resume</text>
</g>
<line x1="320" y1="96" x2="320" y2="120" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
  <rect x="140" y="126" width="360" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="320" y="146" text-anchor="middle" dominant-baseline="central">Assemble request</text>
  <text class="ts" x="320" y="166" text-anchor="middle" dominant-baseline="central">system prompt + session messages</text>
</g>
<line x1="320" y1="182" x2="320" y2="206" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
  <rect x="140" y="212" width="360" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="320" y="232" text-anchor="middle" dominant-baseline="central">Stream from provider</text>
  <text class="ts" x="320" y="252" text-anchor="middle" dominant-baseline="central">sse blocks, usage, cache events</text>
</g>
<line x1="320" y1="268" x2="320" y2="292" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
  <rect x="140" y="298" width="360" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="320" y="318" text-anchor="middle" dominant-baseline="central">Auto-compact check</text>
  <text class="ts" x="320" y="338" text-anchor="middle" dominant-baseline="central">summarise if over threshold</text>
</g>
<line x1="320" y1="354" x2="320" y2="378" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
  <rect x="140" y="384" width="360" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="320" y="406" text-anchor="middle" dominant-baseline="central">Any tool calls pending?</text>
</g>

<rect x="120" y="452" width="400" height="346" rx="12" class="dash"/>
<text class="ts lbl" x="134" y="470" dominant-baseline="central">for each tool call</text>
<text class="ts lbl" x="332" y="442" dominant-baseline="central">yes</text>
<line x1="320" y1="428" x2="320" y2="474" class="arr" marker-end="url(#arrow)"/>

<g class="c-coral">
  <rect x="140" y="480" width="360" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="320" y="500" text-anchor="middle" dominant-baseline="central">PreToolUse hook</text>
  <text class="ts" x="320" y="520" text-anchor="middle" dominant-baseline="central">may rewrite input or deny</text>
</g>
<line x1="320" y1="536" x2="320" y2="560" class="arr" marker-end="url(#arrow)"/>

<g class="c-coral">
  <rect x="140" y="566" width="360" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="320" y="586" text-anchor="middle" dominant-baseline="central">Permission check</text>
  <text class="ts" x="320" y="606" text-anchor="middle" dominant-baseline="central">policy mode, optional user prompt</text>
</g>
<line x1="320" y1="622" x2="320" y2="646" class="arr" marker-end="url(#arrow)"/>

<g class="c-coral">
  <rect x="140" y="652" width="360" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="320" y="672" text-anchor="middle" dominant-baseline="central">Execute tool</text>
  <text class="ts" x="320" y="692" text-anchor="middle" dominant-baseline="central">built-in, skill, subagent, or mcp</text>
</g>
<line x1="320" y1="708" x2="320" y2="732" class="arr" marker-end="url(#arrow)"/>

<g class="c-coral">
  <rect x="140" y="738" width="360" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="320" y="758" text-anchor="middle" dominant-baseline="central">PostToolUse hook</text>
  <text class="ts" x="320" y="778" text-anchor="middle" dominant-baseline="central">merge feedback into result</text>
</g>

<path d="M320 794 V820 H100 V154 H134" class="arr" marker-end="url(#arrow)"/>

<text class="ts lbl" x="530" y="394" dominant-baseline="central">no</text>
<path d="M500 406 H560 V878 H506" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray">
  <rect x="140" y="850" width="360" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="320" y="870" text-anchor="middle" dominant-baseline="central">Turn summary</text>
  <text class="ts" x="320" y="890" text-anchor="middle" dominant-baseline="central">messages, usage, iteration count</text>
</g>

<rect class="c-purple" x="140" y="932" width="12" height="12" rx="3" stroke-width="0.5"/>
<text class="ts lbl" x="158" y="938" dominant-baseline="central">model turn</text>
<rect class="c-coral" x="270" y="932" width="12" height="12" rx="3" stroke-width="0.5"/>
<text class="ts lbl" x="288" y="938" dominant-baseline="central">tool pipeline</text>
</svg>
