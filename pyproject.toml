[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claw-py"
version = "0.1.0"
description = "A minimal reference implementation of the claw-code agentic loop"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
claw-py = "claw_py.cli:main"

[tool.setuptools.packages.find]
include = ["claw_py*"]
